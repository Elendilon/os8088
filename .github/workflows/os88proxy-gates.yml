# The proxy's own gates, on Linux, on every push that touches it.
#
# This is the half of os88proxy-exe.yml worth running often. That workflow is
# ON DEMAND ONLY (it burns a windows-latest runner to freeze a binary), and
# dropping its push trigger left the gates running nowhere at all - so they
# run here instead, where they cost seconds: measured 0.6s for --selfcheck,
# 1.0s for proxytest and 5.0s for proxyguitest, against ~7s of runner setup.
# Nothing is built and nothing is published; this only ever says yes or no.
#
# THE PATHS LIST NAMES THE TESTS AS WELL AS THE CODE, which the .exe
# workflow's never did - so editing a gate did not run it, and a gate that has
# fallen behind the thing it checks is the failure this file exists for.
name: os88proxy gates

on:
  push:
    paths:
      - 'tools/os88proxy.py'
      - 'tools/os88proxygui.py'
      - 'tools/htmsim.py'
      - 'tests/proxytest.py'
      - 'tests/proxyguitest.py'
      - 'tests/proxy/**'
      - '.github/workflows/os88proxy-gates.yml'
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TK IS NOT OPTIONAL HERE, and that is the whole reason this job installs
      # anything. tests/proxyguitest.py runs its settings-table half everywhere
      # and SKIPS its window half where there is no Tk - deliberately, so a
      # developer without one still gets the first half - and it skips by
      # exiting 0. Measured against the seven-long FIELDS row that broke the
      # .exe build: with no Tk the broken gate exits 0, with Tk it exits 1. A
      # job that ran this without Tk would have passed the bug it exists to
      # catch, in the half where the crash actually was.
      #
      # apt's python3-tk installs into the SYSTEM python3, so the system
      # python3 is what runs the gates - no setup-python, whose interpreter
      # apt cannot reach.
      - name: Tk and a display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      # ...and it is ASSERTED rather than assumed, because the skip is silent
      # in exactly the way that matters: if this ever stops installing, the
      # window half stops running and every run still goes green.
      - name: There really is a Tk
        run: |
          python3 -VV
          python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: The engine's own gate
        run: python3 tools/os88proxy.py --selfcheck
      - name: The server, in the guest's wire format
        run: python3 tests/proxytest.py
      - name: The window
        run: xvfb-run -a python3 tests/proxyguitest.py
