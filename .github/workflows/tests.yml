# The regression suite (tools/os88test.py, tests/suite.py).
#
# It exists because this tree accumulated ninety test scripts and no way to
# run them: a merge did not know which of the ninety it should have run, so it
# ran none, and small changes kept breaking things nobody thought to look at.
#
# Two jobs, matching the two tiers a human runs:
#
#   fast   ~3 seconds, host-side only, on every push. Needs nasm and python3
#          and nothing else - the same toolchain a clone needs to build.
#
#   full   ~2 minutes, before a merge. Adds the eighteen knob kernels and
#          kern_small (every configuration `make all` does not build), the C
#          toolchain (the other thing it does not build), and the MartyPC boot
#          smoke test - which is why this job builds the emulator, a cargo
#          build, cached, several minutes cold. The C compiler is fetched and
#          built here too, and is not cached: it is 7 seconds.
#
# The `soak` tier is deliberately NOT here. It is sixty-odd single-subject
# gates at 40-75 seconds each, serialised on one debug port, and it is run by
# whoever touched the subsystem (`os88test.py soak -k disp*`), not by CI.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: fast tier (every build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nasm
      - name: build
        run: make -j"$(nproc)"
      # `make` already runs the fast tier (it is a prerequisite of `all`), so
      # this is the explicit re-run that makes the tier's result its own step
      # in the log rather than the tail of a build.
      - name: fast tier
        run: python3 tools/os88test.py fast

  full:
    name: full tier (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain
        # libudev-dev + pkg-config are MartyPC's: the serialport crate's build
        # script hard-fails without them, several minutes into cargo.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm libudev-dev pkg-config
      - name: cache the emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/martypc/src/target
          key: martypc-${{ runner.os }}-${{ hashFiles('tools/martypc/UPSTREAM', 'tools/martypc/patches/*') }}
      - name: build
        run: make -j"$(nproc)"
      - name: build the emulator
        run: tools/martypc/build.sh
      # The compiler the `ctoolchain` row needs. It is not in the tree and
      # never can be - build/ is gitignored and nothing under it is committed
      # (CLAUDE.md) - so, exactly like the emulator above, the capability has
      # to be provided here or --strict fails the job. No cache: it is a
      # shallow clone and three small C binaries, ~7s cold against the
      # emulator's several minutes.
      - name: build the C compiler
        run: tools/setup-cc.sh
      # --strict so a missing capability FAILS instead of skipping: the whole
      # point of building the emulator above is that the rows needing it run,
      # and a silent skip would make this job green without them.
      - name: full tier
        run: python3 tools/os88test.py full --strict
